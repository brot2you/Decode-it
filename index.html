<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef4f9">
<meta name="description" content="DECODE IT! by BROT2YOU — comprendre un mot anglais inconnu sans dictionnaire, grâce aux indices. Collège, 6e à 3e.">
<title>DECODE IT! — by BROT2YOU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@600;700&family=Lexend:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5/700.css">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon-64.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta property="og:image" content="img/app-icon.webp">
<style>
:root{
  --bg:#eef4f9; --bg2:#ffffff; --ink:#14213d; --ink2:#46546e; --line:#d5e1ec;
  --cyan:#0096c7; --cyan-l:#d6f3ff; --mint:#05a67a; --mint-l:#d9f7ec;
  --violet:#6b4ce6; --violet-l:#ebe5ff; --amber:#f2a100; --amber-l:#fff1c9;
  --coral:#e0435a; --coral-l:#ffe1e5; --shadow:0 6px 0 rgba(20,33,61,.12),0 10px 24px rgba(20,33,61,.08);
  --radius:20px; --fs:18px; --font:'Atkinson Hyperlegible','Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --title:'Chakra Petch','Atkinson Hyperlegible',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); font-size:var(--fs); color:var(--ink); line-height:1.5;
  background-color:var(--bg);
  background-image:linear-gradient(rgba(0,150,199,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,150,199,.06) 1px,transparent 1px);
  background-size:28px 28px; min-height:100vh; -webkit-text-size-adjust:100%;
}
body.dys{--font:'OpenDyslexic','Lexend',system-ui,sans-serif; letter-spacing:.04em; word-spacing:.16em; line-height:1.8}
body.dys .sentence,body.dys .mtext{line-height:2.2}
button{font-family:inherit;font-size:1em;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--violet);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:14px 16px 90px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);border-bottom:2px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.topbar .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px}
.brand{white-space:nowrap;font-family:var(--title);font-weight:700;font-size:1.25em;letter-spacing:.04em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px}
.brand .dot{width:14px;height:14px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px var(--mint-l);animation:pulse 2s infinite}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9em}
.iconbtn{border:2px solid var(--line);background:var(--bg2);border-radius:14px;min-width:46px;height:46px;font-size:1.1em;font-weight:700;padding:0 10px}
.iconbtn:active{transform:translateY(2px)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--mint-l)}50%{box-shadow:0 0 0 8px rgba(5,166,122,.12)}}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--bg2);border:3px solid var(--ink);border-radius:28px;padding:26px 22px;box-shadow:var(--shadow);margin:8px 0 18px}
.hero h1{font-family:var(--title);font-size:clamp(2.2em,7vw,3.8em);line-height:1;margin:0;letter-spacing:.03em}
.hero h1 .x{color:var(--cyan)}
.hero .slogan{font-size:1.15em;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.hero .sig{font-family:var(--title);font-weight:700;color:var(--violet);letter-spacing:.12em;font-size:.9em}
.hero .beam{position:absolute;left:0;right:0;height:46px;top:-60px;background:linear-gradient(180deg,transparent,rgba(0,150,199,.18),rgba(0,150,199,.35),transparent);animation:beam 4.5s ease-in-out infinite;pointer-events:none}
@keyframes beam{0%{top:-60px}55%{top:110%}100%{top:110%}}
.principle{display:flex;align-items:center;gap:12px;background:var(--amber-l);border:2px dashed var(--amber);border-radius:16px;padding:12px 16px;font-weight:700;margin:14px 0}
.principle .ic{font-size:1.5em}

h2.sec{font-family:var(--title);font-size:1.35em;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec .n{background:var(--ink);color:#fff;border-radius:10px;padding:0 10px;font-size:.8em}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lvl{border:3px solid var(--line);background:var(--bg2);border-radius:18px;padding:14px 6px;font-family:var(--title);font-weight:700;font-size:1.5em;box-shadow:0 4px 0 var(--line)}
.lvl small{display:block;font-family:var(--font);font-size:.5em;color:var(--ink2);font-weight:700}
.lvl.on{border-color:var(--cyan);background:var(--cyan-l);box-shadow:0 4px 0 var(--cyan)}
.lvl:active{transform:translateY(3px);box-shadow:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{position:relative;text-align:left;border:3px solid var(--ink);background:var(--bg2);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:transform .12s}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(2px)}
.card .emo{font-size:2.1em;line-height:1}
.card h3{font-family:var(--title);margin:8px 0 4px;font-size:1.25em}
.card p{margin:0;color:var(--ink2);font-size:.92em}
.card .tag{position:absolute;top:12px;right:12px;font-size:.72em;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--mint-l);color:#036b4f}
.card.big{grid-column:1/-1;background:linear-gradient(120deg,#e9fbff,#f3efff);display:flex;gap:16px;align-items:center}
.card.big .emo{font-size:3em}
.c-cyan{border-color:var(--cyan)} .c-violet{border-color:var(--violet)} .c-mint{border-color:var(--mint)} .c-amber{border-color:var(--amber)} .c-coral{border-color:var(--coral)}
.meter{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mint));border-radius:999px;transition:width .6s}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);background:var(--ink);color:#fff;border-radius:16px;padding:13px 22px;font-weight:700;font-size:1.02em;box-shadow:0 5px 0 rgba(20,33,61,.35);min-height:54px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(20,33,61,.35)}
.btn.ghost{background:var(--bg2);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.cyan{background:var(--cyan);border-color:#00739a}
.btn.mint{background:var(--mint);border-color:#037a5a}
.btn.violet{background:var(--violet);border-color:#4f33c2}
.btn.amber{background:var(--amber);border-color:#b97b00;color:#2b1d00}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:flex-end}
.back{border:0;background:none;font-weight:700;color:var(--ink2);padding:8px 0;font-size:1em}

/* steps bar */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 14px}
.st{border:2px solid var(--line);background:var(--bg2);border-radius:12px;padding:6px 4px;text-align:center;font-size:.74em;font-weight:700;color:var(--ink2);position:relative}
.st b{display:block;font-family:var(--title);font-size:1.35em;color:var(--ink2)}
.st.now{border-color:var(--cyan);background:var(--cyan-l);color:var(--ink)}
.st.now b{color:var(--cyan)}
.st.done{border-color:var(--mint);background:var(--mint-l);color:#036b4f}
.st.done b{color:var(--mint)}

/* panels */
.panel{background:var(--bg2);border:3px solid var(--ink);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h3{font-family:var(--title);margin:0 0 10px;font-size:1.2em}
.q{font-weight:700;font-size:1.08em;margin:0 0 12px}
.muted{color:var(--ink2)}
.small{font-size:.86em}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.meta span{font-size:.78em;font-weight:700;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:3px 10px}

/* sentence & tokens */
.sentence{font-size:1.32em;line-height:2;margin:4px 0 10px}
.tok{display:inline;border:0;background:none;padding:2px 2px;margin:0;border-radius:8px;font:inherit;line-height:inherit;color:inherit;cursor:pointer}
.tok.sel{background:var(--violet-l);box-shadow:inset 0 -4px 0 var(--violet)}
.tok.lit{background:var(--amber-l);box-shadow:0 0 0 2px var(--amber),0 0 14px rgba(242,161,0,.55);animation:glow 1.4s ease-in-out 2}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--amber),0 0 22px rgba(242,161,0,.8)}}
.tok.target,.target{display:inline-block;line-height:1.35;position:relative;font-weight:700;color:var(--cyan);background:var(--cyan-l);border-radius:8px;padding:2px 6px;box-shadow:inset 0 0 0 2px var(--cyan);overflow:hidden}
.target.scan::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);animation:scan 2.2s infinite}
@keyframes scan{0%{left:-40%}60%,100%{left:120%}}
.punct{white-space:pre-wrap}
.next{color:var(--ink2);font-size:.95em;border-left:4px solid var(--line);padding-left:10px;margin:8px 0}

/* answer buttons */
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{text-align:left;border:3px solid var(--line);background:var(--bg2);border-radius:16px;padding:14px 16px;font-weight:700;min-height:56px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt.ok{border-color:var(--mint);background:var(--mint-l);box-shadow:0 4px 0 var(--mint)}
.opt.ko{border-color:var(--coral);background:var(--coral-l);box-shadow:0 4px 0 var(--coral);opacity:.85}
.opt .sub{display:block;font-weight:400;font-size:.82em;color:var(--ink2)}
.pos-n{--pc:#0096c7}.pos-v{--pc:#e0435a}.pos-a{--pc:#6b4ce6}.pos-r{--pc:#05a67a}
.opt.pos{border-left:10px solid var(--pc)}

.fb{border-radius:16px;padding:12px 16px;margin:12px 0;font-weight:400;border:2px solid}
.fb b{font-weight:700}
.fb.ok{background:var(--mint-l);border-color:var(--mint)}
.fb.ko{background:var(--coral-l);border-color:var(--coral)}
.fb.info{background:var(--cyan-l);border-color:var(--cyan)}
.fb.clue{background:var(--amber-l);border-color:var(--amber)}
.hintbox{background:#fffdf3;border:2px dashed var(--amber);border-radius:16px;padding:10px 14px;margin:10px 0}
.hintbox ol{margin:6px 0;padding-left:22px}

textarea,input[type=text]{width:100%;font:inherit;font-size:1.05em;border:3px solid var(--line);border-radius:14px;padding:12px;background:#fff;color:var(--ink)}
.selfeval{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.selfeval .opt{text-align:center;font-size:1.05em}
.verify{font-size:1.2em;background:var(--bg);border-radius:14px;padding:12px 14px;line-height:1.8}
.verify .fr{background:var(--mint-l);box-shadow:inset 0 0 0 2px var(--mint);border-radius:8px;padding:2px 6px;font-weight:700}

/* split */
.split{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;margin:16px 0;font-family:var(--title);font-size:2em;font-weight:700}
.split .let{padding:6px 2px;min-width:.7em;text-align:center}
.split .gap{border:0;background:none;width:20px;margin:0 -2px;position:relative;padding:0}
.split .gap::before{content:"";position:absolute;left:8px;top:14%;bottom:14%;width:4px;border-radius:4px;background:var(--line)}
.split .gap.cut::before{background:var(--coral);left:7px;width:6px;top:0;bottom:0}
.split .gap:hover::before{background:var(--violet)}
.parts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.part{border:3px solid var(--violet);background:var(--violet-l);border-radius:14px;padding:8px 14px;text-align:center}
.part b{display:block;font-family:var(--title);font-size:1.25em}
.part span{font-size:.85em}

/* lists */
.exlist{display:grid;gap:10px}
.exi{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--line);background:var(--bg2);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 var(--line)}
.exi .num{font-family:var(--title);font-weight:700;width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.exi .tx{flex:1;min-width:0}
.exi .tx b{display:block}
.exi .tx span{color:var(--ink2);font-size:.85em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exi.done{border-color:var(--mint)}
.exi.done .num{background:var(--mint);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.tab{border:2px solid var(--line);background:var(--bg2);border-radius:999px;padding:8px 16px;font-weight:700}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* mystery text */
.mtext{font-size:1.16em;line-height:2;background:var(--bg2);border:3px solid var(--ink);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.mtext h3{font-family:var(--title);margin:0 0 6px;line-height:1.3}
.mword{border:0;font:inherit;font-weight:700;color:var(--cyan);background:var(--cyan-l);border-radius:8px;padding:1px 7px;box-shadow:inset 0 0 0 2px var(--cyan);position:relative;overflow:hidden;cursor:pointer;line-height:1.5}
.mword.solved{color:#036b4f;background:var(--mint-l);box-shadow:inset 0 0 0 2px var(--mint)}
.mword.solved::after{content:attr(data-fr);display:inline;font-weight:400;font-size:.75em;margin-left:6px;color:#036b4f}
.mword.active{box-shadow:inset 0 0 0 3px var(--violet);background:var(--violet-l);color:var(--violet)}
.cluelit{background:var(--amber-l);box-shadow:0 0 0 2px var(--amber);border-radius:6px}
.cluechips{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}

/* poly */
.polygrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.psent,.psense{text-align:left;border:3px solid var(--line);background:var(--bg2);border-radius:16px;padding:12px 14px;font-weight:400;box-shadow:0 4px 0 var(--line);margin-bottom:10px;width:100%}
.psense{font-weight:700}
.psent.pick,.psense.pick{border-color:var(--violet);background:var(--violet-l)}
.psent.ok{border-color:var(--mint);background:var(--mint-l)}
.psent .lnk{display:block;font-weight:700;color:#036b4f;font-size:.9em;margin-top:4px}
.bigword{font-family:var(--title);font-size:2.6em;font-weight:700;text-align:center;margin:6px 0}

/* jabber */
.jab{font-size:1.5em;text-align:center;line-height:2.2;margin:10px 0}
.jw{border:0;font:inherit;font-weight:700;padding:2px 10px;border-radius:10px;background:var(--violet-l);box-shadow:inset 0 0 0 2px var(--violet);color:var(--violet);cursor:pointer}
.jw.active{background:var(--amber-l);box-shadow:inset 0 0 0 3px var(--amber);color:#7a5200}
.jw.done{background:var(--mint-l);box-shadow:inset 0 0 0 2px var(--mint);color:#036b4f}
.jw sub{font-size:.45em;display:block;line-height:1;font-family:var(--font)}

/* progress */
.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gauge{background:var(--bg2);border:3px solid var(--line);border-radius:18px;padding:14px}
.gauge .h{display:flex;justify-content:space-between;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{text-align:center;background:var(--bg2);border:3px dashed var(--line);border-radius:18px;padding:14px 8px;color:var(--ink2)}
.badge .e{font-size:2.2em;filter:grayscale(1);opacity:.4}
.badge b{display:block;font-family:var(--title);font-size:.95em}
.badge span{font-size:.74em}
.badge.got{border:3px solid var(--violet);background:var(--violet-l);color:var(--ink)}
.badge.got .e{filter:none;opacity:1}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,33,61,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--bg2);border:3px solid var(--ink);border-radius:24px;max-width:560px;width:100%;padding:20px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--violet);color:#fff;border-radius:18px;padding:12px 20px;font-weight:700;box-shadow:var(--shadow);animation:pop .35s;max-width:92vw;text-align:center}
@keyframes pop{0%{transform:translateX(-50%) scale(.7);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px solid var(--line)}
.result{text-align:center}
.result .score{font-family:var(--title);font-size:3em;font-weight:700;color:var(--mint)}
.foot{text-align:center;color:var(--ink2);font-size:.85em;margin-top:30px}
.foot b{color:var(--violet);font-family:var(--title);letter-spacing:.1em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:640px){
  .brand{font-size:1.05em}
  .topbar .in{gap:6px;padding:8px 10px}
  :root{--fs:17px}
  .levels{grid-template-columns:repeat(4,1fr);gap:6px}
  .lvl{font-size:1.2em;padding:10px 2px}
  .polygrid{grid-template-columns:1fr}
  .opts.two{grid-template-columns:1fr 1fr}
  .st{font-size:.62em;padding:4px 2px}
  .card.big{flex-direction:column;align-items:flex-start}
  .sentence{font-size:1.18em}
  .selfeval{grid-template-columns:1fr}
  .split{font-size:1.6em}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* === Visuels BROT2YOU (nov. 2026) === */
.ic{display:inline-block;height:1.35em;width:auto;vertical-align:-.32em;object-fit:contain}
.card .emo .ic{height:2em;vertical-align:middle}
.card.big .emo .ic{height:1.5em}
.sec .ic{height:1.5em;vertical-align:-.4em}
.panel h3 .ic{height:1.45em}
.tab .ic,.btn .ic{height:1.4em;vertical-align:-.38em}
.brand .logo-ic{height:34px;width:auto;display:block}
.hero.hero-img{display:flex;align-items:center;gap:14px;padding:18px 18px 16px}
.hero .hero-txt{flex:1 1 auto;min-width:0;position:relative;z-index:1}
.hero .logo{display:block;width:100%;max-width:520px;height:auto;margin:0 0 4px}
.hero .mascot{flex:0 0 auto;width:min(34%,230px);height:auto;position:relative;z-index:1;filter:drop-shadow(0 6px 0 rgba(20,33,61,.12))}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.hero.hero-img{flex-direction:column-reverse;text-align:center}.hero .logo{margin:0 auto 4px}.hero .mascot{width:42%}}
.badge .frame{position:relative;width:86px;height:86px;margin:0 auto 6px;display:grid;place-items:center;background:url(img/badge-frame.webp) center/contain no-repeat}
.badge .frame .e{font-size:1.75em;line-height:1;filter:grayscale(1);opacity:.4}
.badge .frame .e .ic{height:1.5em;vertical-align:middle}
.badge:not(.got) .frame{filter:grayscale(1);opacity:.55}
.badge.got .frame .e{filter:none;opacity:1}
</style>
</head>
<body>
<!--
  DECODE IT! — by BROT2YOU
  =========================
  Tous les contenus sont dans les blocs script de type "application/json" ci-dessous.
  Pour ajouter un exercice / un mot / un texte : copier un objet existant, le coller à la suite

    var g = X.g, it = g.items[i], a = X.a[i] || { tries: 0, picked: {}, ok: false };
    if (a.ok || a.tries >= 2) { return; }
    if (p === it.pos) { a.ok = true; X.f[i] = { k: "ok", h: "✅ <b>" + POS[p].fr + "</b> — « " + esc(it.w) + " » = " + esc(it.fr) + ". " + esc(it.why) }; }
    else {
      a.tries++; a.picked[p] = 1;
      X.f[i] = a.tries < 2 ? { k: "ko", h: posWrongMsg(p, it.s, it.w) } : { k: "info", h: "C'était : <b>" + POS[it.pos].fr + "</b> — « " + esc(it.w) + " » = " + esc(it.fr) + ". " + esc(it.why) };
    }
    X.a[i] = a; render();
  };
  ACT.jword = function (i) { X.active = parseInt(i, 10); X.f = null; render(); };
  ACT.jpos = function (p) {
    var j = X.j, i = X.active, w = j.words[i], a = X.a[i] || { tries: 0, picked: {}, ok: false };
    if (a.ok || a.tries >= 2) { return; }
    if (p === w.pos) { a.ok = true; X.f = { k: "ok", h: "✅ <b>" + POS[p].fr + "</b> — " + esc(w.why) }; }
    else {
      a.tries++; a.picked[p] = 1;
      X.f = a.tries < 2 ? { k: "ko", h: posWrongMsg(p, j.s, w.w) } : { k: "info", h: "C'était : <b>" + POS[w.pos].fr + "</b> — " + esc(w.why) };
    }
    X.a[i] = a; render();
  };
  ACT.nextg = function (kind) {
    var list = kind === "same" ? D.grammar.sameWord : D.grammar.jabberwocky, cur = kind === "same" ? X.g : X.j, lv = [], i, idx = 0;
    each(list, function (e) { if (e.level === cur.level) { lv.push(e); } });
    for (i = 0; i < lv.length; i++) { if (lv[i].id === cur.id) { idx = i; } }
    go(kind, { a: lv[(idx + 1) % lv.length].id });
  };
  /* polysémie */
  ACT.psent = function (i) { i = parseInt(i, 10); if (X.matched[i]) { return; } X.ps = i; X.f = null; if (X.pm != null) { polyCheck(); } else { render(); } };
  ACT.psense = function (id) { X.pm = id; X.f = null; if (X.ps != null) { polyCheck(); } else { render(); } };
  ACT.nextp = function () {
    var lv = [], i, idx = 0, cur = X.w;
    each(D.poly.words, function (e) { if (e.level === cur.level) { lv.push(e); } });
    for (i = 0; i < lv.length; i++) { if (lv[i].id === cur.id) { idx = i; } }
    go("poly", { a: lv[(idx + 1) % lv.length].id });
  };
  /* textes */
  ACT.tread = function () { X.read = true; render(); };
  ACT.mword = function (i) {
    if (!X.read) { X.read = true; }
    i = parseInt(i, 10);
    if (!X.w[i]) { X.w[i] = newWordState(X.t.words[i]); }
    X.active = i; render();
  };
  ACT.tclose = function () { X.active = null; render(); };
  ACT.tstep = function (s) { var st = X.w[X.active]; st.step = s; st.f = null; render(); };
  ACT.tclue = function (k) {
    var w = X.t.words[X.active], st = X.w[X.active];
    if (st.res.clue != null) { return; }
    if (!st.declared) { st.declared = k; SES.decl[k] = (SES.decl[k] || 0) + 1; saveSession(); }
    var also = w.alsoOk || [];
    var ok = k === w.clueType || also.indexOf(k) >= 0;
    if (ok) {
      st.res.clue = st.tries.clue === 0 ? 1 : 0.5; st.lit = true;
      st.f = { k: "ok", h: "✅ <b>" + esc(CLUES[k].en) + "</b> — l'indice s'allume dans le texte. " + (k !== w.clueType ? "C'est une bonne piste ; l'indice principal est « " + esc(CLUES[w.clueType].en) + " ». " : "") };
    } else {
      st.tries.clue++; st.cluePicked[k] = 1;
      if (st.tries.clue < 2) { st.f = { k: "ko", h: "❌ <b>Pas vraiment.</b> " + esc(CLUES[k].not) + " Essaie un autre type d'indice." }; }
      else { st.res.clue = 0; st.lit = true; st.f = { k: "info", h: IC("step2") + " L'indice le plus utile ici : <b>" + CLUES[w.clueType].emo + " " + esc(CLUES[w.clueType].en) + "</b>. Il s'allume dans le texte." }; }
    }
    render();
  };
  ACT.tpos = function (p) {
    var w = X.t.words[X.active], st = X.w[X.active];
    if (st.res.pos != null) { return; }
    if (p === w.pos) { st.res.pos = st.tries.pos === 0 ? 1 : 0.5; st.f = { k: "ok", h: "✅ <b>" + POS[p].fr + ".</b> " + esc(w.posWhy) }; }
    else {
      st.tries.pos++; st.posPicked[p] = 1;
      if (st.tries.pos < 2) { st.f = { k: "ko", h: posWrongMsg(p, X.t.text, w.word) }; }
      else { st.res.pos = 0; st.f = { k: "info", h: "C'était : <b>" + POS[w.pos].fr + "</b>. " + esc(w.posWhy) }; }
    }
    render();
  };
  ACT.topt = function (i) {
    var w = X.t.words[X.active], st = X.w[X.active], o = w.options[parseInt(i, 10)];
    if (st.res.ans != null || st.picked[i]) { return; }
    st.picked[i] = 1;
    if (o.correct) { st.res.ans = st.tries.ans === 0 ? 1 : (st.tries.ans === 1 ? 0.5 : 0.25); st.f = { k: "ok", h: "✅ <b>" + esc(o.text) + "</b> — " + esc(o.why) }; }
    else { st.tries.ans++; st.f = { k: "ko", h: "❌ <b>" + esc(o.text) + "</b> — " + esc(o.why) + " <i>Essaie une autre hypothèse.</i>" }; }
    render();
  };
  ACT.ttypedgo = function () {
    var st = X.w[X.active];
    if (!st.typed || !st.typed.replace(/\s/g, "")) { st.f = { k: "info", h: "✍️ Écris d'abord ton hypothèse, même si tu n'es pas sûr(e)." }; render(); return; }
    st.step = "verify"; st.f = null; render();
  };
  ACT.tself = function (v) {
    var st = X.w[X.active];
    if (!st.self) { S.cnt.selfEval = (S.cnt.selfEval || 0) + 1; save(); }
    st.self = v; st.res.ans = v === "ok" ? 1 : (v === "close" ? 0.6 : 0.2); render();
  };
  ACT.tdone = function () {
    var w = X.t.words[X.active], st = X.w[X.active];
    if (st.done) { return; }
    st.done = true; st.score = avg([st.res.clue || 0, st.res.pos || 0, st.res.ans || 0]);
    record(w.clueType, st.score, null, false);
    X.active = null; render();
  };
  ACT.nextt = function () {
    var lv = [], i, idx = 0, cur = X.t;
    each(D.texts.texts, function (e) { if (e.level === cur.level) { lv.push(e); } });
    for (i = 0; i < lv.length; i++) { if (lv[i].id === cur.id) { idx = i; } }
    go("text", { a: lv[(idx + 1) % lv.length].id });
  };

  document.addEventListener("click", function (e) {
    var t = e.target;
    while (t && t !== document && !(t.getAttribute && t.getAttribute("data-act"))) { t = t.parentNode; }
    if (!t || t === document) {
      if (e.target && e.target.className === "modal") { closeModal(); }
      return;
    }
    var fn = ACT[t.getAttribute("data-act")];
    if (fn) { e.preventDefault(); fn(t.getAttribute("data-a"), t.getAttribute("data-b"), t); }
  });
  document.addEventListener("input", function (e) {
    var k = e.target && e.target.getAttribute && e.target.getAttribute("data-in");
    if (k === "typed" && X) { X.typed = e.target.value; }
    if (k === "ttyped" && X && X.active != null) { X.w[X.active].typed = e.target.value; }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("modal").innerHTML) { closeModal(); } });

  /* exposé pour les tests */
  window.DECODEIT = { data: D, state: function () { return S; }, go: go, ACT: ACT, view: function () { return X; } };
  render();
})();

</script>
<script src="https://brot2you.github.io/b2y-outils/b2y-sauvegarde.js" data-app="Decode It" data-keys="decodeit*"></script>
